# Knightwatcher: the collector and the bundled server, both from the image the Dockerfile builds.
# Host paths, the server's address and port, the admin password and the credentials come from .env
# beside this file (ignored by git; .env.example is the template); see docs/configuration.md and
# docs/server.md.
# Every host path is bound with create_host_path: false, so a missing path stops the container
# instead of Docker creating an empty folder in its place. The provider files' default folder,
# ./providers, is tracked in git with a .gitkeep, so a checkout always has it.
name: knightwatcher

services:
  collector:
    build: .
    container_name: knightwatcher-collector
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # An account of its own that owns nothing on the host; docs/configuration.md says how to
    # give it the few files it needs.
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-m", "collector", "--health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 2
    # Credentials, read once at start. Each is named here, so that the container gets these from
    # .env and nothing else in it. One a config does not use may be unset: it arrives empty, and
    # the collector's own check names any credential it needs and lacks.
    environment:
      KNIGHTWATCHER_TAUTULLI_API_KEY: ${KNIGHTWATCHER_TAUTULLI_API_KEY:-}
      KNIGHTWATCHER_PLEX_TOKEN: ${KNIGHTWATCHER_PLEX_TOKEN:-}
      KNIGHTWATCHER_ADGUARD_USERNAME: ${KNIGHTWATCHER_ADGUARD_USERNAME:-}
      KNIGHTWATCHER_ADGUARD_PASSWORD: ${KNIGHTWATCHER_ADGUARD_PASSWORD:-}
      KNIGHTWATCHER_PIHOLE_PASSWORD: ${KNIGHTWATCHER_PIHOLE_PASSWORD:-}
      KNIGHTWATCHER_TECHNITIUM_TOKEN: ${KNIGHTWATCHER_TECHNITIUM_TOKEN:-}
      KNIGHTWATCHER_SONARR_API_KEY: ${KNIGHTWATCHER_SONARR_API_KEY:-}
      KNIGHTWATCHER_RADARR_API_KEY: ${KNIGHTWATCHER_RADARR_API_KEY:-}
    volumes:
      # Settings, read at start and again whenever the file is written in place.
      - type: bind
        source: ./config.toml
        target: /etc/knightwatcher/config.toml
        read_only: true
        bind: { create_host_path: false }
      # Provider files of the user's own, beside config.toml, read at start and again whenever one
      # changes. Left out of .env, it is the repository's providers folder, which ships empty.
      - type: bind
        source: ${KNIGHTWATCHER_PROVIDERS:-./providers}
        target: /etc/knightwatcher/providers
        read_only: true
        bind: { create_host_path: false }
      # The host's /proc: CPU, memory, load, the lock table and process command lines.
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind: { create_host_path: false }
      # The backup log, a single file rotated in place.
      - type: bind
        source: ${KNIGHTWATCHER_BACKUP_LOG:?set KNIGHTWATCHER_BACKUP_LOG in .env}
        target: /host/backup.log
        read_only: true
        bind: { create_host_path: false }
      # Any small folder on the data volume, so statvfs can see the volume's size.
      - type: bind
        source: ${KNIGHTWATCHER_DATA_DISK:?set KNIGHTWATCHER_DATA_DISK in .env}
        target: /host/disks/data
        read_only: true
        bind: { create_host_path: false }
      # Where state.json is written, for the server to serve.
      - type: bind
        source: ${KNIGHTWATCHER_OUT:?set KNIGHTWATCHER_OUT in .env}
        target: /out
        bind: { create_host_path: false }
      # What survives a restart: the event sequence and the last-seen markers.
      - type: bind
        source: ${KNIGHTWATCHER_VAR:-./var}
        target: /var/lib/knightwatcher
        bind: { create_host_path: false }
      # The server's folder, read only: what is set on the admin page, in admin.json, laid over
      # config.toml and taken up between polls.
      - type: bind
        source: ${KNIGHTWATCHER_SERVER_VAR:-./var/server}
        target: /var/lib/knightwatcher-server
        read_only: true
        bind: { create_host_path: false }

  # The page, state.json, the shared settings and the admin page, over plain HTTP. It gets no
  # credential: from .env it is given the admin password alone, and compose reads its address and
  # port to publish it. The walls are open to the LAN by default; docs/server.md says how to put a
  # login in front.
  server:
    build: .
    container_name: knightwatcher-server
    entrypoint: ["python", "-m", "server"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    healthcheck:
      test: ["CMD", "python", "-m", "server", "--health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 2
    # The admin page's password, and nothing else from .env. Left empty, or shorter than 12
    # characters, the admin page stays off.
    environment:
      KNIGHTWATCHER_ADMIN_PASSWORD: ${KNIGHTWATCHER_ADMIN_PASSWORD:-}
    # Inside the container it listens on 8080; on the host, at the address and port in .env. With
    # no address it is published on all of the host's addresses.
    ports:
      - "${KNIGHTWATCHER_SERVER_ADDRESS:+${KNIGHTWATCHER_SERVER_ADDRESS:-}:}${KNIGHTWATCHER_SERVER_PORT:-8080}:8080"
    volumes:
      # The collector's output: state.json, the packs it downloaded, and the names of the
      # credentials it holds (credentials.json, read and never served). Read only.
      - type: bind
        source: ${KNIGHTWATCHER_OUT:?set KNIGHTWATCHER_OUT in .env}
        target: /out
        read_only: true
        bind: { create_host_path: false }
      # Settings, read only, so that the admin page checks a change as the collector will. It holds
      # no secret.
      - type: bind
        source: ./config.toml
        target: /etc/knightwatcher/config.toml
        read_only: true
        bind: { create_host_path: false }
      # The provider files, read only, for the same checks: a source's `from` may name one.
      - type: bind
        source: ${KNIGHTWATCHER_PROVIDERS:-./providers}
        target: /etc/knightwatcher/providers
        read_only: true
        bind: { create_host_path: false }
      # The server's own folder, where the shared settings and the admin page's are kept: the one
      # place it writes.
      - type: bind
        source: ${KNIGHTWATCHER_SERVER_VAR:-./var/server}
        target: /var/lib/knightwatcher-server
        bind: { create_host_path: false }
