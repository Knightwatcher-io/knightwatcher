# Knightwatcher collector settings. Copy to config.toml (ignored by git) and fill in your own.
# Every value here is invented. docs/configuration.md describes each setting. Credentials are
# never set here: they go in .env (see .env.example), named by each source's `secret`.
# A source runs when its [sources.*] table is present and `enabled` is not false. Each source is
# read every `every_s` seconds; between reads its last reading stands. As it stands the file turns
# on the general sources alone, which read this host or a fixed address; each source that reads a
# service, the settings screen's defaults and the devices are written out but commented. A setting
# changed on the bundled server's admin page is kept there, over this file, and its Download
# config.toml writes them all.

[collector]
interval_s = 10
output_dir = "/out"
state_dir = "/var/lib/knightwatcher"
timezone = "UTC"
http_timeout_s = 5.0
auth_backoff_s = 1200
proc_root = "/host/proc"
providers_dir = "providers"

[conditions]
# Highest first. A condition left out of the list is never raised.
priority = [
  "attack", "wan_down", "container_unhealthy", "disk_full", "backup_overdue", "pi_silent",
  "device_down", "cpu_hot", "memory_tight", "ssh_session", "updating", "streaming", "night",
]
clear_after_s = 30

[conditions.attack]
window_s = 600
jails = ["sshd"]
bans = 5

[conditions.wan_down]
failed_checks = 2

[conditions.container_unhealthy]
for_s = 180

[conditions.disk_full]
pct = 90.0

[conditions.backup_overdue]
hours = 30.0

[conditions.pi_silent]
for_s = 180

[conditions.cpu_hot]
pct = 85.0
window_s = 30

[conditions.memory_tight]
available_pct = 10.0
window_s = 30

[conditions.ssh_session]
min_sessions = 1
show_for_s = 600

[conditions.streaming]
min_streams = 1

[conditions.night]
start = "23:00"
end = "07:00"

# The general sources: they read this host's own /proc, a log file on it, or a fixed address, so
# they work on any Linux host with Docker, and they are on.

[sources.host]
enabled = true
every_s = 10
disks = [{ mount = "/data", path = "/host/disks/data" }]

[sources.wan]
enabled = true
every_s = 30
urls = ["https://1.1.1.1/cdn-cgi/trace"]

[sources.dns]
enabled = true
every_s = 30
server = "127.0.0.53"          # systemd-resolved on most Linux hosts; or your own DNS server's address
port = 53
name = "example.com"

[sources.backup]
enabled = true
every_s = 60
log = "/host/backup.log"
pattern = 'Backup completed: (.+)$'
timezone = "UTC"
read_bytes = 262144

[sources.updates]
enabled = true
every_s = 10
holders = [
  { name = "nightly maintenance", pattern = 'nightly-maintenance\.sh' },
]

[sources.ssh]
enabled = true
every_s = 10
port = 22
ignore_sources = []

# The sources that read a service: each needs that service, at your own address, and most a
# credential in .env. Each is written out here but commented. Remove the "# " before a table's
# lines to use it, the table's name included; a line starting "# or:" stays commented, since it
# replaces another.

# Container health, through a read-only proxy of the Docker API (docs/configuration.md).
# [sources.containers]
# enabled = true
# every_s = 10
# url = "http://192.0.2.10:2375"
# ignore = ["*-run-*", "knightwatcher-collector-*"]

# A second machine, such as a Raspberry Pi, the older way; a [[device]] table at the end is the
# newer one.
# [sources.pi]
# enabled = true
# every_s = 30
# host = "192.0.2.4"
# ports = [22]

# [sources.streams]
# enabled = true
# every_s = 30
# from = "tautulli"            # the default; "plex" reads Plex Media Server itself (KNIGHTWATCHER_PLEX_TOKEN),
#                              # "tracearr" reads Tracearr 2.0 or later (KNIGHTWATCHER_TRACEARR_API_KEY),
#                              # "jellyfin" reads Jellyfin itself (KNIGHTWATCHER_JELLYFIN_API_KEY)
# url = "http://192.0.2.20:8181"
# verify_tls = true            # with an https url, whether its certificate is checked
# show = "names"               # who and what; "titles" for what alone, "count" for how many
# secret = "tautulli"          # reads KNIGHTWATCHER_TAUTULLI_API_KEY from .env

# [sources.adblock]
# enabled = true
# every_s = 30
# from = "adguard"             # the default; "pihole" reads Pi-hole 6 (KNIGHTWATCHER_PIHOLE_PASSWORD),
#                              # "technitium" Technitium 15 or later (KNIGHTWATCHER_TECHNITIUM_TOKEN)
# url = "http://192.0.2.53"
# verify_tls = true            # false for an https url with a self-signed certificate, as a Pi-hole's
# secret = "adguard"           # reads KNIGHTWATCHER_ADGUARD_USERNAME and _PASSWORD
# fly_every_s = 300

# [sources.security]
# enabled = true
# every_s = 30
# from = "fail2ban"            # the default; needs a mount and a read grant (docs/configuration.md)
# database = "/host/fail2ban/fail2ban.sqlite3"   # the default, inside the collector's container
# or: url = "http://192.0.2.40:8080"   # in place of database, for a provider file of your own
# or: verify_tls = true        # with that url, as for the other sections
# secret = "fail2ban"          # fail2ban needs no credential

# [sources.sonarr]
# enabled = true
# every_s = 30
# url = "http://192.0.2.30:8989"
# verify_tls = true            # with an https url, whether its certificate is checked
# secret = "sonarr"            # reads KNIGHTWATCHER_SONARR_API_KEY

# [sources.radarr]
# enabled = true
# every_s = 30
# url = "http://192.0.2.31:7878"
# verify_tls = true            # with an https url, whether its certificate is checked
# secret = "radarr"            # reads KNIGHTWATCHER_RADARR_API_KEY

# [sources.lidarr]
# enabled = true
# every_s = 30
# url = "http://192.0.2.32:8686"
# verify_tls = true            # with an https url, whether its certificate is checked
# secret = "lidarr"            # reads KNIGHTWATCHER_LIDARR_API_KEY; one crate for each album

# More services whose imports are read, each a [[sources.imports]] table: another Sonarr, Radarr
# or Lidarr, or a service a provider file of your own reads. Each is the source imports:<name>.
# Set them here; the admin page lists them. Remove the "# " before each line to use one.

# A second Sonarr, for a 4K library. Its key needs a secret of its own, and the collector gets a
# variable no built-in provider reads only when compose.override.yaml names it in the collector's
# environment (docs/configuration.md has the snippet).
# [[sources.imports]]
# name = "sonarr-4k"         # 1 to 20 of a-z, 0-9 and -; not sonarr, radarr or lidarr
# from = "sonarr"            # any imports provider: sonarr, radarr, lidarr or a file of your own
# url = "http://192.0.2.34:8989"
# secret = "sonarr_4k"       # reads KNIGHTWATCHER_SONARR_4K_API_KEY; the provider's id when left out
# every_s = 30
# verify_tls = true          # with an https url, whether its certificate is checked
# enabled = true

# Generic checks, each a [[sources.json]] table: one value read from a JSON reply and tested. A
# check that holds raises check:<name>, which the display acts as the condition named in `as`,
# with the check's own words. Each is the source json:<name>. Set them here; the admin page lists
# them. Remove the "# " before each line to use one.

# A disk temperature from a NAS's status page, shown in the yard as cpu_hot is. The header's value
# reads a variable no built-in provider names, which reaches the collector only when
# compose.override.yaml names it in the collector's environment (docs/configuration.md).
# [[sources.json]]
# name = "nas-temp"          # 1 to 20 of a-z, 0-9 and -
# url = "http://192.0.2.40:8080/api/status"   # the whole address, with its path and query
# path = "$.disks[0].temp_c" # where the value is, as provider files write paths
# test = "above"             # equals, above, below, contains or missing
# value = 70                 # what it is compared with; not with missing
# headline = "NAS HOT"       # 1 to 16 characters, shown in capitals
# detail = "disk at {value} C"   # up to 60 characters; {value} is what the path found
# as = "cpu_hot"             # any condition but device_down, and one in conditions.priority
# every_s = 60               # 10 to 3600
# for_s = 0                  # how long the test must hold first
# header = "X-Api-Key"       # optional: one header, its value from .env
# secret = "nas"             # with header: reads KNIGHTWATCHER_NAS_HEADER; else the name, - as _
# verify_tls = true          # with an https url, whether its certificate is checked
# enabled = true

# The household defaults for the display's settings screen. Every display starts from these; a
# choice made on a wall's settings screen or the admin page is saved over them, for the whole
# deployment. A setting left out takes the page's own default. Remove the "# " before a table and
# its settings to use them. world sets every part of the look, the quiet scenes and the scene of
# each condition at once; a part set beside it here is kept over the world's.

# [look]
# world = "medieval"          # medieval, or a world of a loaded pack, "<pack>/<world>"
# build = "a"                 # a Classic, b Broad, c Slim, or a body of a loaded pack, "<pack>/<build>"
# weapon = "greatsword"       # greatsword, sword_and_shield, longsword, mace_and_shield or crossbow
# skin = "warm"               # fair, warm, golden, tan, brown or deep, or "<pack>/<swatch>"
# hair = "brown"              # black, dark, brown, auburn, blonde or silver, or "<pack>/<swatch>"
# hair_style = "short"        # short, tied, curls, long or close
# tabard = "blue"             # blue, forest, violet, wine, teal or sable, or "<pack>/<swatch>"
# plume = "red"               # red, white, gold, royal, green or violet, or "<pack>/<swatch>"
# shield = "heater"           # heater, round or kite; carried with sword_and_shield or mace_and_shield
# helmet = "open"             # open, kettle, coif or bascinet; the coif carries no plume
# plume_style = "crest"       # crest, feather or horsehair
# body = "tabard"             # tabard, cuirass (a breastplate) or gambeson
# shoulders = "plate"         # plate, lames (layered spaulders) or leather
# arms = "plate"              # plate, mail or padded
# hands = "plate"             # plate, leather or mail
# legs = "plate"              # plate, mail or hose
# feet = "leather"            # leather (riding boots), sabatons or shoes
# back = "none"               # none, cloak (in the plume's colour) or cape (in the tabard's)
# monarch = "a"               # a, b or c, or a patron of a loaded pack, "<pack>/<patron>"
# monarch_skin = "warm"       # the same six as skin, or "<pack>/<swatch>"
# monarch_hair = "brown"      # the six of hair, or "<pack>/<swatch>"; left out, each monarch keeps their own
# monarch_robe = "wine"       # the six of tabard, or "<pack>/<swatch>"; left out, each keeps their own robe
# pet = "cat"                 # the mouser cat, or "<pack>/<pet>"
# pet_coat = "calico"         # calico or ginger (a ginger tabby), or "<pack>/<coat>" of that pack's pet
# foe = "goblin"              # goblin, or "<pack>/<foe>"
# critter = "fly"             # fly, or "<pack>/<critter>"
# props = "medieval"          # the devices' drawings: medieval, or "<pack>/<prop set>"
# overlay = "medieval"        # the words' colours and font: medieval, or "<pack>/<overlay>"
# words = "medieval"          # the quiet line's and the captions' words: medieval, or "<pack>/<word set>"

# Any slot's item by its long name, over the key above that chooses it.
# [look.items]
# main = "kw.base/main.arming"

# The drawing of one kind of device, over props for that kind: pi, camera, machine, vm or box.
# [look.devices]
# camera = "medieval"

# [display]
# headline = "medium"         # small, medium or large
# clock = 24                  # 24 or 12
# helmet_indoors = false      # true keeps the helmet on in the house and the smithy

# [quiet]
# scenes = ["battlement", "camp", "house", "yard"]   # one or more of these four, no repeats
# minutes = 10                # whole minutes each quiet scene shows, 1 to 240

# The scene each condition plays in, each shown here in its own. Only these five take part.
# [scenes]
# attack = "battlement"       # battlement, camp or yard
# disk_full = "cellar"        # cellar or yard
# backup_overdue = "house"    # battlement, camp, house, yard or cellar
# pi_silent = "house"         # battlement, camp or house
# cpu_hot = "yard"            # battlement, camp, house, yard or cellar

# Devices: machines on the network, each drawn as a prop in the scene that changes when
# its machine has been silent for its down_after_s. Remove the "# " before a setting to use it.
# Here the main LAN is 192.0.2.0/24, the cameras sit on a VLAN of their own (198.51.100.0/24) and
# a guest VLAN holds the laptop (203.0.113.0/24). The router between the VLANs must let this host
# reach 198.51.100.31 on 443 and 203.0.113.45 on 22.

# A NAS on the main LAN. Alerts after the default three minutes of silence.
# [[device]]
# name = "Vault"
# kind = "machine"
# host = "192.0.2.40"
# port = 445

# A camera on its own VLAN, checked through its web page once a minute. Cameras reboot for
# firmware and drop off the network for a few minutes, so it alerts after ten.
# [[device]]
# name = "Gate cam"
# kind = "camera"
# url = "https://198.51.100.31/"
# verify_tls = false          # its certificate is self-signed, so it is not checked
# every_s = 60
# down_after_s = 600

# A laptop on the guest VLAN. It sleeps, so it never alerts: when it is away its prop goes,
# and nothing else happens. Its own firewall refuses closed ports, so a refusal means it is on.
# [[device]]
# name = "Study laptop"
# kind = "machine"
# host = "203.0.113.45"
# port = 22
# refused_counts = true
# alert = false

# A virtual machine on the main LAN, checked on two ports at once. It is switched off for now:
# its table stays, nothing is checked and it is left out of the display.
# [[device]]
# name = "Buildbox"
# kind = "vm"
# host = "192.0.2.41"
# ports = [22, 8080]
# enabled = false
