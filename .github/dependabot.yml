# Weekly update checks, a few pull requests at a time. The minor and patch updates of each
# ecosystem come together in one pull request, and a major update in one of its own. The commit
# messages are Conventional Commits (ci: for the actions, build: for pip and the base image,
# chore: for the receiver's npm packages), and every pull request is labelled dependencies. The
# sign-off check (workflows/dco.yml) passes over commits made by GitHub's own bots, Dependabot
# among them.
version: 2
updates:
  # pyproject.toml at the root: the collector and the server use the standard library alone.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The usage counts' receiver.
  - package-ecosystem: "npm"
    directory: "/telemetry"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Dockerfile's base image.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "build"
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The workflows' actions, pinned to commit SHAs.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
