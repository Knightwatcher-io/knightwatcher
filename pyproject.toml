[project]
name = "knightwatch-collector"
version = "0.1.0"
description = "Reads a homelab and writes the state file for the Knightwatch wall display"
requires-python = ">=3.13"
# Standard library only, at run time and in the tests.
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["web", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = [
  "RUF001",  # the middle dot and the ellipsis are wanted in the display's words
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["collector", "kw_helpers"]
